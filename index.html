<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Cảnh Báo Cháy AIoT</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase JS SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-8">
  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center pb-6 border-b border-slate-700 gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-red-500 flex items-center gap-2">
          🔥 HỆ THỐNG GIÁM SÁT & BÁO CHÁY AIoT
        </h1>
        <p class="text-slate-400 text-sm mt-1">Tích hợp AI Dự Báo Sớm Nguy Cơ Cháy (Time-Series Analysis)</p>
      </div>
      <!-- Nút Bật/Tắt Thông Báo Đổi Màu Động -->
      <button id="btnPush" onclick="toggleNotification()" class="bg-red-600 hover:bg-red-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
        🔔 Bật Thông Báo Push
      </button>
    </header>

    <!-- Danh sách các Trạm -->
    <div id="stationsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
      <div class="text-center text-slate-400 col-span-2 py-10">Đang khởi tạo thuật toán AI & kết nối Firebase...</div>
    </div>
  </div>

  <script>
    // 1. Cấu hình Firebase
    const firebaseConfig = {
      databaseURL: "https://duanpccc-7ca9b-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Cấu hình Push Notification & Lưu trạng thái vĩnh viễn (localStorage)
    let isNotificationEnabled = localStorage.getItem('pccc_push_enabled') === 'true';
    let swRegistration = null;

    // Cập nhật ngay giao diện nút bấm khi vừa tải xong DOM
    document.addEventListener("DOMContentLoaded", () => {
      updateNotificationButton();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        swRegistration = reg;
        console.log('Service Worker đã sẵn sàng!');
        updateNotificationButton();
      }).catch((err) => {
        console.error('Lỗi đăng ký Service Worker:', err);
      });
    }

    // Cập nhật giao diện nút Bật/Tắt theo trạng thái đã lưu
    function updateNotificationButton() {
      const btn = document.getElementById('btnPush');
      if (!btn) return;

      if (isNotificationEnabled && Notification.permission === 'granted') {
        btn.className = "bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2";
        btn.innerHTML = "🔕 Tắt Thông Báo Push";
      } else {
        isNotificationEnabled = false;
        localStorage.setItem('pccc_push_enabled', 'false');
        btn.className = "bg-red-600 hover:bg-red-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2";
        btn.innerHTML = "🔔 Bật Thông Báo Push";
      }
    }

    // Công tắc Bật / Tắt thông báo
    function toggleNotification() {
      if (!isNotificationEnabled) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            isNotificationEnabled = true;
            localStorage.setItem('pccc_push_enabled', 'true');
            updateNotificationButton();
            sendPhoneNotification("🔥 HỆ THỐNG PCCC AIoT", "Đã bật và lưu trạng thái thông báo đẩy thành công!");
          } else {
            alert('Bạn cần cấp quyền thông báo trên trình duyệt/điện thoại!');
          }
        });
      } else {
        isNotificationEnabled = false;
        localStorage.setItem('pccc_push_enabled', 'false');
        updateNotificationButton();
      }
    }

    // Hàm thực thi đẩy thông báo ra màn hình điện thoại
    function sendPhoneNotification(title, body) {
  if (!isNotificationEnabled || Notification.permission !== 'granted') return;

  // Gửi lệnh đẩy thông báo cho Service Worker xử lý luồng rung báo động
  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({
      type: 'SHOW_NOTIFICATION',
      title: title,
      body: body
    });
  } else if (swRegistration && swRegistration.active) {
    swRegistration.active.postMessage({
      type: 'SHOW_NOTIFICATION',
      title: title,
      body: body
    });
  } else if ('Notification' in window) {
    new Notification(title, {
      body: body,
      icon: 'https://cdn-icons-png.flaticon.com/512/785/785116.png',
      vibrate: [1000, 200, 1000, 200, 1000]
    });
  }
}
  // 2. Dự phòng: Gửi thẳng qua Notification API (Đảm bảo nổ 100% khi màn hình đang bật)
  else if (swRegistration && swRegistration.active) {
    swRegistration.active.postMessage({
      type: 'SHOW_NOTIFICATION',
      title: title,
      body: body
    });
  } else {
    new Notification(title, {
      body: body,
      icon: 'https://cdn-icons-png.flaticon.com/512/785/785116.png',
      vibrate: [500, 200, 500]
    });
  }
}

    // 3. MÔ HÌNH AI DỰ BÁO NGUY CƠ CHÁY (GIỮ NGUYÊN BẢN CỦA BẠN)
    const historyData = {}; 
    const alertStates = {};

    function runAIPrediction(stationId, currentTemp, currentGas, isFire) {
      if (isFire) return { status: "DANGER", msg: "🚨 CẢNH BÁO: PHÁT HIỆN LỬA TRỰC TIẾP!" };

      if (!historyData[stationId]) {
        historyData[stationId] = { temp: currentTemp, gas: currentGas, time: Date.now() };
        return { status: "SAFE", msg: "🟢 Trạng thái: An toàn (AI đang giám sát)" };
      }

      const prev = historyData[stationId];
      const timeDiff = (Date.now() - prev.time) / 1000; // tính bằng giây

      if (timeDiff >= 3) { // Cập nhật tính toán mỗi 3 giây
        const tempRate = (currentTemp - prev.temp) / timeDiff; // Độ C / giây
        const gasRate = (currentGas - prev.gas) / timeDiff;   // PPM / giây

        // Cập nhật lại điểm lịch sử
        historyData[stationId] = { temp: currentTemp, gas: currentGas, time: Date.now() };

        // Đánh giá thuật toán AI
        if (tempRate > 0.5 || gasRate > 15 || (currentTemp > 40 && currentGas > 400)) {
          return { status: "WARNING", msg: "⚡ AI CẢNH BÁO SỚM: Nhiệt độ/Gas tăng vọt bất thường!" };
        }
      }

      if (currentGas > 500) {
        return { status: "WARNING", msg: "⚠️ CẢNH BÁO: Nồng độ Gas cao vượt ngưỡng!" };
      }

      return { status: "SAFE", msg: "🟢 Trạng thái: An toàn" };
    }

    // 4. ĐỌC VÀ HIỂN THỊ DỮ LIỆU TỪ FIREBASE REALTIME
    const stationsRef = db.ref('/DanhSachTram');

    stationsRef.on('value', (snapshot) => {
      const data = snapshot.val();
      const container = document.getElementById('stationsContainer');
      if (!data) return;

      container.innerHTML = '';
      
      for (const [tramKey, tramData] of Object.entries(data)) {
        const aiResult = runAIPrediction(
          tramKey, 
          tramData.NhietDo || 0, 
          tramData.NongDoGas || 0, 
          tramData.CoTiaLua || false
        );

        const isAlert = aiResult.status !== "SAFE";
        const stationName = tramKey.replace('_', ' ');

        // Tự động đẩy thông báo ra điện thoại khi AI phát hiện nguy hiểm hoặc có lửa
        if (isAlert) {
          if (!alertStates[tramKey]) {
            sendPhoneNotification(`⚠️ CẢNH BÁO [${stationName}]`, aiResult.msg);
            alertStates[tramKey] = true;
          }
        } else {
          alertStates[tramKey] = false;
        }

        const cardHtml = `
          <div class="bg-slate-800 rounded-2xl p-6 border ${isAlert ? 'border-red-500 animate-pulse' : 'border-slate-700'} shadow-xl">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-700">
              <h2 class="text-xl font-bold text-slate-200">📍 ${stationName}</h2>
              <span class="px-3 py-1 rounded-full text-xs font-bold ${isAlert ? 'bg-red-500/20 text-red-400 border border-red-500' : 'bg-green-500/20 text-green-400 border border-green-500'}">
                ${tramData.TrangThai || 'An toan'}
              </span>
            </div>

            <!-- Khung dự báo AI -->
            <div class="mb-4 p-3 rounded-xl text-xs font-semibold ${isAlert ? 'bg-red-950/80 text-red-300 border border-red-800' : 'bg-slate-900 text-emerald-400'}">
              🤖 ${aiResult.msg}
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div class="bg-slate-900/60 p-3 rounded-xl">
                <p class="text-xs text-slate-400">🌡️ Nhiệt Độ</p>
                <p class="text-2xl font-bold ${tramData.NhietDo > 40 ? 'text-red-400' : 'text-slate-100'}">${tramData.NhietDo ?? '--'} °C</p>
              </div>
              <div class="bg-slate-900/60 p-3 rounded-xl">
                <p class="text-xs text-slate-400">💧 Độ Ẩm</p>
                <p class="text-2xl font-bold text-slate-100">${tramData.DoAm ?? '--'} %</p>
              </div>
              <div class="bg-slate-900/60 p-3 rounded-xl">
                <p class="text-xs text-slate-400">💨 Nồng Độ Gas</p>
                <p class="text-2xl font-bold ${tramData.NongDoGas > 400 ? 'text-amber-400' : 'text-slate-100'}">${tramData.NongDoGas ?? '--'} <span class="text-xs font-normal">PPM</span></p>
              </div>
              <div class="bg-slate-900/60 p-3 rounded-xl">
                <p class="text-xs text-slate-400">🌫️ Nồng Độ Bụi</p>
                <p class="text-2xl font-bold text-slate-100">${tramData.NongDoBui ?? '--'} <span class="text-xs font-normal">µg/m³</span></p>
              </div>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-700/50 flex justify-between items-center text-xs text-slate-400">
              <span>Cảm biến lửa: <strong class="${tramData.CoTiaLua ? 'text-red-400 font-bold' : 'text-green-400'}">${tramData.CoTiaLua ? 'Phát hiện tia lửa!' : 'Bình thường'}</strong></span>
            </div>
          </div>
        `;
        container.innerHTML += cardHtml;
      }
    });
  </script>
</body>
</html>
