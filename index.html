<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Cảnh Báo Cháy AIoT</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase JS SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-8">
  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center pb-6 border-b border-slate-700 gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-red-500 flex items-center gap-2">
          🔥 HỆ THỐNG GIÁM SÁT & BÁO CHÁY AIoT
        </h1>
        <p class="text-slate-400 text-sm mt-1">Tích hợp AI Dự Báo Sớm Nguy Cơ Cháy (ESP32 TinyML & Cloud 24/7)</p>
      </div>
      <!-- Nút Bật/Tắt Thông Báo Đổi Màu Động -->
      <button id="btnPush" onclick="toggleNotification()" class="bg-red-600 hover:bg-red-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
        🔔 Bật Thông Báo Push
      </button>
    </header>

    <!-- Danh sách các Trạm -->
    <div id="stationsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
      <div class="text-center text-slate-400 col-span-2 py-10">Đang kết nối dữ liệu cảm biến...</div>
    </div>

    <!-- KHUNG LỊCH SỬ CẢNH BÁO KHẨN CẤP & XUẤT CSV -->
    <div class="mt-10 bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-xl">
      <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
        <h2 class="text-xl font-bold text-slate-200 flex items-center gap-2">
          📜 Lịch Sử Cảnh Báo Khẩn Cấp (Event Log)
        </h2>
        <!-- Nút Xuất File CSV -->
        <button onclick="exportAlarmHistoryToCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
          📥 Xuất File CSV
        </button>
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-900 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
              <th class="p-3">Trạm</th>
              <th class="p-3">Nhiệt Độ</th>
              <th class="p-3">Độ Ẩm</th>
              <th class="p-3">Gas (PPM)</th>
              <th class="p-3">Xác Suất AI</th>
              <th class="p-3">Mức Độ Nguy Cơ</th>
            </tr>
          </thead>
          <tbody id="historyTableBody" class="divide-y divide-slate-700/50 text-sm text-slate-300">
            <tr>
              <td colspan="6" class="p-4 text-center text-slate-500">Chưa có lịch sử cảnh báo nào ghi nhận.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // 1. Cấu hình Firebase
    const firebaseConfig = {
      databaseURL: "https://duanpccc-7ca9b-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Cấu hình Push Notification & Lưu trạng thái
    let isNotificationEnabled = localStorage.getItem('pccc_push_enabled') === 'true';
    let swRegistration = null;

    document.addEventListener("DOMContentLoaded", () => {
      updateNotificationButton();
      loadAlarmHistory(); // Gọi hàm tải và lắng nghe lịch sử cảnh báo
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        swRegistration = reg;
        console.log('Service Worker đã sẵn sàng!');
        updateNotificationButton();
      }).catch((err) => {
        console.error('Lỗi đăng ký Service Worker:', err);
      });
    }

    function updateNotificationButton() {
      const btn = document.getElementById('btnPush');
      if (!btn) return;

      if (isNotificationEnabled && Notification.permission === 'granted') {
        btn.className = "bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2";
        btn.innerHTML = "🔕 Tắt Thông Báo Push";
      } else {
        isNotificationEnabled = false;
        localStorage.setItem('pccc_push_enabled', 'false');
        btn.className = "bg-red-600 hover:bg-red-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2";
        btn.innerHTML = "🔔 Bật Thông Báo Push";
      }
    }

    function toggleNotification() {
      if (!isNotificationEnabled) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            isNotificationEnabled = true;
            localStorage.setItem('pccc_push_enabled', 'true');
            updateNotificationButton();
            sendPhoneNotification("🔥 HỆ THỐNG PCCC AIoT", "Đã bật thông báo đẩy thành công!");
          } else {
            alert('Bạn cần cấp quyền thông báo trên trình duyệt/điện thoại!');
          }
        });
      } else {
        isNotificationEnabled = false;
        localStorage.setItem('pccc_push_enabled', 'false');
        updateNotificationButton();
      }
    }

    function sendPhoneNotification(title, body) {
      if (!isNotificationEnabled || Notification.permission !== 'granted') return;

      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({
          type: 'SHOW_NOTIFICATION',
          title: title,
          body: body
        });
      } else if (swRegistration && swRegistration.active) {
        swRegistration.active.postMessage({
          type: 'SHOW_NOTIFICATION',
          title: title,
          body: body
        });
      } else if ('Notification' in window) {
        new Notification(title, {
          body: body,
          icon: 'https://cdn-icons-png.flaticon.com/512/785/785116.png'
        });
      }
    }

    const alertStates = {};

    // 3. LẤY DỮ LIỆU TỪ TRẠM (REALTIME)
    const stationsRef = db.ref('/DanhSachTram');

    stationsRef.on('value', (snapshot) => {
      const data = snapshot.val();
      const container = document.getElementById('stationsContainer');
      if (!container) return;

      if (!data) {
        container.innerHTML = '<div class="text-center text-slate-400 col-span-2 py-10">Không tìm thấy dữ liệu trạm trên Firebase!</div>';
        return;
      }

      container.innerHTML = '';
      
      for (const [tramKey, tramData] of Object.entries(data)) {
        const isFire = tramData.CoTiaLua === true || tramData.CoTiaLua === "true";
        const temp = parseFloat(tramData.NhietDo || 0);
        const gas = parseFloat(tramData.NongDoGas || 0);
        
        const aiRisk = tramData.XacSuatChayAI !== undefined ? parseFloat(tramData.XacSuatChayAI) : 0;
        const aiMsg = tramData.MucDoNguyCoAI || "An toàn";
        
        const isAlert = aiRisk >= 50.0 || isFire || aiMsg.includes("BÁO ĐỘNG") || aiMsg.includes("Cảnh báo");
        const stationName = tramKey.replace('_', ' ');

        if (isAlert) {
          if (!alertStates[tramKey]) {
            sendPhoneNotification(`⚠️ CẢNH BÁO [${stationName}]`, `Xác suất cháy AI: ${aiRisk.toFixed(1)}% - ${aiMsg}`);
            alertStates[tramKey] = true;
          }
        } else {
          alertStates[tramKey] = false;
        }

        let progressBarColor = "bg-emerald-500";
        if (aiRisk >= 75 || isFire) {
          progressBarColor = "bg-red-500 animate-pulse";
        } else if (aiRisk >= 40) {
          progressBarColor = "bg-amber-500";
        }

        const cardHtml = `
          <div class="bg-slate-800 rounded-2xl p-6 border ${isAlert ? 'border-red-500 animate-pulse' : 'border-slate-700'} shadow-xl">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-700">
              <h2 class="text-xl font-bold text-slate-200">📍 ${stationName}</h2>
              <span class="px-3 py-1 rounded-full text-xs font-bold ${isAlert ? 'bg-red-500/20 text-red-400 border border-red-500' : 'bg-green-500/20 text-green-400 border border-green-500'}">
                ${tramData.TrangThai || (isAlert ? 'Nguy hiểm!' : 'An toàn')}
              </span>
            </div>

            <div class="mb-4 p-3 rounded-xl ${isAlert ? 'bg-red-950/80 border border-red-800 text-red-300' : 'bg-slate-900 border border-slate-700 text-emerald-400'}">
              <div class="flex justify-between items-center mb-2 text-xs font-semibold">
                <span>🤖 AI Dự báo: ${aiMsg}</span>
                <span class="font-bold text-sm">${aiRisk.toFixed(1)}%</span>
              </div>
              <div class="w-full bg-slate-700 rounded-full h-3">
                <div class="${progressBarColor} h-3 rounded-full transition-all duration-500" style="width: ${Math.min(aiRisk, 100)}%"></div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div class="bg-slate-900/60 p-3 rounded-xl">
                <p class="text-xs text-slate-400">🌡️ Nhiệt Độ</p>
                <p class="text-2xl font-bold ${temp > 40 ? 'text-red-400' : 'text-slate-100'}">${tramData.NhietDo ?? '--'} °C</p>
              </div>
              <div class="bg-slate-900/60 p-3 rounded-xl">
                <p class="text-xs text-slate-400">💧 Độ Ẩm</p>
                <p class="text-2xl font-bold text-slate-100">${tramData.DoAm ?? '--'} %</p>
              </div>
              <div class="bg-slate-900/60 p-3 rounded-xl">
                <p class="text-xs text-slate-400">💨 Nồng Độ Gas</p>
                <p class="text-2xl font-bold ${gas > 400 ? 'text-amber-400' : 'text-slate-100'}">${tramData.NongDoGas ?? '--'} <span class="text-xs font-normal">PPM</span></p>
              </div>
              <div class="bg-slate-900/60 p-3 rounded-xl">
                <p class="text-xs text-slate-400">🌫️ Nồng Độ Bụi</p>
                <p class="text-2xl font-bold text-slate-100">${tramData.NongDoBui ?? '--'} <span class="text-xs font-normal">µg/m³</span></p>
              </div>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-700/50 flex justify-between items-center text-xs text-slate-400">
              <span>Cảm biến lửa: <strong class="${isFire ? 'text-red-400 font-bold' : 'text-green-400'}">${isFire ? 'Phát hiện tia lửa!' : 'Bình thường'}</strong></span>
            </div>
          </div>
        `;
        container.innerHTML += cardHtml;
      }
    });

    // 4. LẮNG NGHE LỊCH SỬ CẢNH BÁO & XUẤT CSV
    let globalHistoryData = [];

    function loadAlarmHistory() {
      const historyRef = db.ref('/LichSuCanhBao').limitToLast(100);
      const tableBody = document.getElementById('historyTableBody');

      historyRef.on('value', (snapshot) => {
        const historyData = snapshot.val();
        if (!historyData) return;

        globalHistoryData = historyData; // Lưu lại dữ liệu để xuất CSV
        tableBody.innerHTML = ''; 
        
        const entries = Object.entries(historyData).reverse();

        entries.forEach(([key, log]) => {
          const row = document.createElement('tr');
          row.className = "hover:bg-slate-700/30 transition";
          row.innerHTML = `
            <td class="p-3 font-semibold text-slate-200">📍 Trạm ${log.NodeID ?? '--'}</td>
            <td class="p-3">${log.NhietDo ?? '--'} °C</td>
            <td class="p-3">${log.DoAm ?? '--'} %</td>
            <td class="p-3">${log.NongDoGas ?? '--'} PPM</td>
            <td class="p-3 font-bold text-red-400">${(log.XacSuatChayAI || 0).toFixed(1)}%</td>
            <td class="p-3 font-semibold text-amber-400">${log.MucDoNguyCoAI ?? 'Cảnh báo'}</td>
          `;
          tableBody.appendChild(row);
        });
      });
    }

    function exportAlarmHistoryToCSV() {
      if (!globalHistoryData || Object.keys(globalHistoryData).length === 0) {
        alert("Không có dữ liệu lịch sử để xuất file!");
        return;
      }

      let csvContent = "\uFEFFNodeID,NhietDo(C),DoAm(%),NongDoGas(PPM),NongDoBui(ug/m3),XacSuatChayAI(%),MucDoNguyCoAI\n";

      Object.values(globalHistoryData).forEach(log => {
        const row = [
          `Tram ${log.NodeID ?? 0}`,
          log.NhietDo ?? 0,
          log.DoAm ?? 0,
          log.NongDoGas ?? 0,
          log.NongDoBui ?? 0,
          (log.XacSuatChayAI ?? 0).toFixed(1),
          `"${log.MucDoNguyCoAI ?? ''}"`
        ];
        csvContent += row.join(",") + "\n";
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      
      const dateStr = new Date().toISOString().slice(0, 10);
      link.setAttribute("href", url);
      link.setAttribute("download", `LichSuCanhBao_AIoT_${dateStr}.csv`);
      document.body.appendChild(link);
      
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
